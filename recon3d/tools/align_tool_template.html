<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>軌跡アライメントツール</title>
<style>
  * { box-sizing: border-box; }
  body { margin:0; font: 13px/1.5 system-ui, sans-serif; background:#16171c; color:#ddd; }
  a { color:#7cc4ff; }
  #home { max-width: 760px; margin: 40px auto; padding: 0 16px; }
  .card { background:#20222a; border:1px solid #333; border-radius:10px; padding:14px 18px;
          margin:10px 0; cursor:pointer; display:flex; justify-content:space-between; }
  .card:hover { border-color:#7cc4ff; }
  .badge { padding:1px 8px; border-radius:10px; font-size:12px; }
  .ok { background:#1d4d2b; color:#8fe3a8; } .ng { background:#50382a; color:#f0b27c; }
  #app { display:none; height:100vh; }
  #side { width:300px; float:left; height:100%; overflow-y:auto; background:#1b1d23;
          border-right:1px solid #333; padding:10px; }
  #main { margin-left:300px; height:100%; position:relative; }
  canvas { display:block; width:100%; height:100%; cursor:grab; }
  .isl { padding:8px 10px; border:1px solid #333; border-radius:8px; margin:6px 0; cursor:pointer; }
  .isl.sel { border-color:#7cc4ff; background:#232a36; }
  button { background:#2d3748; color:#ddd; border:1px solid #555; border-radius:6px;
           padding:5px 10px; cursor:pointer; margin:2px; }
  button:hover { border-color:#7cc4ff; }
  button.primary { background:#1f4f8f; border-color:#2b6cb0; }
  #nums { font-family:monospace; font-size:12px; color:#9ab; white-space:pre; }
  #framebox { margin-top:10px; }
  #framebox img { width:100%; border-radius:6px; cursor: zoom-in; }
  #lightbox { display:none; position:fixed; inset:0; background:rgba(0,0,0,.88);
              z-index:50; overflow:hidden; cursor:grab; }
  #lightbox img { position:absolute; left:0; top:0; transform-origin:0 0;
                  user-select:none; -webkit-user-drag:none; }
  #lbbar { position:fixed; top:10px; left:50%; transform:translateX(-50%);
           background:rgba(25,27,33,.9); padding:6px 14px; border-radius:8px;
           z-index:51; display:flex; gap:10px; align-items:center; }
  #hint { position:absolute; left:8px; bottom:6px; color:#889; font-size:12px;
          background:rgba(20,21,26,.75); padding:3px 8px; border-radius:6px; }
  #toast { position:absolute; top:10px; right:12px; background:#1d4d2b; color:#b7f3c8;
           padding:6px 12px; border-radius:8px; display:none; }
  input[type=range] { width:150px; vertical-align:middle; }
  h3 { margin:8px 0 4px; font-size:14px; }
</style>
</head>
<body>
<div id="home"></div>
<div id="app">
  <div id="side">
    <div><a href="/">&larr; ホーム</a></div>
    <h3 id="sesstitle"></h3>
    <div id="isls"></div>
    <h3>変換</h3>
    <div id="nums"></div>
    <div>回転 <input type="range" id="rot" min="-180" max="180" step="0.1" value="0">
         <span id="rotv"></span>°</div>
    <div>
      <button onclick="nudgeRot(-1)">&#8634; Q</button>
      <button onclick="nudgeRot(1)">E &#8635;</button>
      <button onclick="nudgeScale(1.01,1.01)">拡大</button>
      <button onclick="nudgeScale(1/1.01,1/1.01)">縮小</button>
    </div>
    <div>
      <button onclick="nudgeScale(1.01,1)">X+</button>
      <button onclick="nudgeScale(1/1.01,1)">X&minus;</button>
      <button onclick="nudgeScale(1,1.01)">Y+</button>
      <button onclick="nudgeScale(1,1/1.01)">Y&minus;</button>
    </div>
    <div>
      <button class="primary" id="savebtn" onclick="save()">登録</button>
      <button onclick="resetT()">リセット</button>
    </div>
    <h3>区間微調整</h3>
    <div>
      <button onclick="segSplit()"
              title="選択中の軌跡点が属するチャンクの直前で区間を区切る。区間ごとに移動・回転・スケールできる">選択点で区切る</button>
      <button onclick="segMerge()"
              title="アクティブ区間を隣の区間と結合する">区切りを解除</button>
    </div>
    <div>
      <label><input type="checkbox" id="allseg" onchange="draw()"
                    title="チェック中は操作が全区間に一体で効く (島全体の配置直し用)"> 全区間を一括操作</label>
    </div>
    <div id="seginfo" style="margin:4px 0"></div>
    <div>
      <label><input type="checkbox" id="showden" checked> 密度マップ</label>
      <label><input type="checkbox" id="showothers" checked
                    onchange="draw()"> 同じ階の他の島</label>
    </div>
    <div id="framebox"></div>
  </div>
  <div id="main">
    <canvas id="cv"></canvas>
    <div id="hint">ドラッグ=軌跡移動 / 右ドラッグ or Space+ドラッグ=パン / ホイール=ズーム /
      Shift+ホイール=スケール / Alt+ホイール=Xのみ / Alt+Shift+ホイール=Yのみ /
      Q,E=回転(Shiftで0.1°) / 点クリック=フレーム表示 (&larr;&rarr;で前後) /
      <b>区間微調整中: 操作はアクティブ区間 (点クリックで切替) のみに効く</b></div>
    <div id="toast"></div>
  </div>
</div>
<div id="lightbox">
  <div id="lbbar">
    <span id="lbtitle"></span>
    <button onclick="lbNav(-1)">&larr;</button>
    <button onclick="lbNav(1)">&rarr;</button>
    <span style="color:#889">ホイール=ズーム / ドラッグ=移動</span>
    <button onclick="closeLightbox()">&#10005; 閉じる (Esc)</button>
  </div>
  <img id="lbimg" alt="">
</div>
<script>/*DATA*/</script>
<script>
"use strict";
// JSエラーを画面に出す (操作が効かなくなる系の不具合の一次診断用)
window.addEventListener("error", ev => {
  const t = document.getElementById("toast");
  if (!t) return;
  t.textContent = "JSエラー: " + ev.message + " (" + (ev.filename||"").split("/").pop() + ":" + ev.lineno + ")";
  t.style.background = "#5f2b2b"; t.style.color = "#f3b7b7";
  t.style.display = "block";
});
// ---------------------------------------------------------------- ホーム
if (BOOT.mode === "home") {
  const el = document.getElementById("home");
  el.innerHTML = "<h2>軌跡アライメント — セッション選択</h2>" +
    BOOT.sessions.map(s =>
      `<div class="card" onclick="location='/align?sess=${s.sess}'">
         <div><b>${s.root}</b> / ${s.sess} <span style="color:#889">(${s.floors.join("・")})</span></div>
         <div><span class="badge ${s.n_saved===s.n_islands?'ok':'ng'}">
           登録 ${s.n_saved}/${s.n_islands}</span></div>
       </div>`).join("") +
    `<p style="color:#889">クリックしてセッションを開き、島ごとに軌跡を図面へ合わせて「登録」してください。</p>`;
}

// ---------------------------------------------------------------- アライン
// 変換状態 T: 島セル(row,col) → グリッドセル の 2x2 アフィン A と並進 t
//   u = A·v + t   (u,v は [row, col])
let P = null, cur = -1;
let T = null;                 // {A:[[a00,a01],[a10,a11]], t:[r,c]} (選択島の状態への参照)
let S = [];                   // 島ごとの変換状態 (切替しても編集を保持)
const ISLAND_COLORS = ["#ffac28", "#55d6ff", "#9dff57", "#ff6bd5",
                       "#ffe14d", "#8f9dff", "#5effc0", "#ff8f6b"];
let view = {s: 0.35, x: 20, y: 20};
let drawImgs = {}, denImgs = {};
let denChunkImgs = {};   // 島index -> {チャンク番号: Image (白+アルファ)}
let tintCache = {};      // "i_c_色" -> 着色済みcanvas
let selFrameIdx = -1;
const cv = document.getElementById("cv");
const ctx = cv ? cv.getContext("2d") : null;

if (BOOT.mode === "align") {
  document.getElementById("home").style.display = "none";
  document.getElementById("app").style.display = "block";
  fetch(`/session-data?sess=${BOOT.sess}`).then(r => {
    if (!r.ok) return r.text().then(t => { throw new Error(t); });
    return r.json();
  }).then(init).catch(e => alert("読み込み失敗: " + e));
}

function init(payload) {
  P = payload;
  S = P.islands.map(isl => initState(isl));
  document.getElementById("sesstitle").textContent = `${P.sess} — 島 ${P.islands.length}件`;
  for (const [fl, f] of Object.entries(P.floors)) {
    const im = new Image(); im.src = f.drawing; drawImgs[fl] = im;
    im.onload = draw;
  }
  denChunkImgs = {}; tintCache = {};
  P.islands.forEach((isl, i) => {
    const im = new Image(); im.src = isl.density_png; denImgs[i] = im;
    im.onload = draw;
    if (isl.density_chunks) {
      denChunkImgs[i] = {};
      for (const [c, url] of Object.entries(isl.density_chunks)) {
        const ci = new Image(); ci.src = url; ci.onload = draw;
        denChunkImgs[i][c] = ci;
      }
    }
  });
  renderIslands();
  selectIsland(0);
  resize();
}

function renderIslands() {
  document.getElementById("isls").innerHTML = P.islands.map((isl, i) =>
    `<div class="isl ${i===cur?'sel':''}" onclick="selectIsland(${i})">
       <span style="color:${ISLAND_COLORS[i%ISLAND_COLORS.length]}">●</span>
       ${isl.tag} <span style="color:#889">(${isl.floor}, ${isl.frames.length}f)</span>
       <span class="badge ${isl.saved?'ok':'ng'}">${isl.saved?'登録済み':'未登録'}</span>
     </div>`).join("");
}

function cloneT(src) { return {A: src.A.map(r => r.slice()), t: src.t.slice()}; }
function cloneSeg(sg) { return {chunks: sg.chunks.slice(), ...cloneT(sg)}; }

// 島の変換状態: {A, t} + 区間微調整があれば segs: [{chunks, A, t}] と active
function initState(isl) {
  const st = cloneT(isl.init);
  if (isl.segments && isl.segments.length >= 2) {
    st.segs = isl.segments.map(cloneSeg);
    st.active = 0;
  }
  return st;
}

// T = 操作対象の変換 ({A,t} 参照)。区間微調整中はアクティブ区間を指す
function syncT() {
  const st = S[cur];
  T = st.segs ? st.segs[st.active] : st;
  renderSegs();
}

function selectIsland(i) {
  const sameFloor = cur >= 0 && P.islands[i].floor === P.islands[cur].floor;
  cur = i;
  selFrameIdx = -1;
  syncT();
  document.getElementById("framebox").innerHTML = "";
  renderIslands();
  if (!sameFloor) fitView();     // 同じ階内の切替ではビューを保つ
  draw();
}
function resetT() {
  S[cur] = initState(P.islands[cur]);
  syncT();
  draw();
}

// ---------------- 区間微調整 (セグメント)
// 区間 = 島のチャンク列の連続部分。各区間が独自の (A,t) を持つ。
// 登録時にサーバが区間ごとの独立アンカー + 親アンカーの "segments" を書き、
// パイプライン (meshing.islands_expanded) が仮想島として展開する
const SEG_COLORS = ["#ffac28", "#55d6ff", "#9dff57", "#ff6bd5",
                    "#ffe14d", "#8f9dff", "#5effc0", "#ff8f6b"];

function chunkSegMap(i) {       // チャンク番号 → 区間index (区間なしなら null)
  const segs = S[i].segs;
  if (!segs) return null;
  const m = {};
  segs.forEach((sg, k) => sg.chunks.forEach(c => m[c] = k));
  return m;
}
function segIdxOfFrame(i, j) {  // 島iのフレームj(表示順) → 区間index
  const m = chunkSegMap(i);
  return m ? m[P.islands[i].frame_chunk[j]] : null;
}
function framesInSeg(i, sg) {
  const set = new Set(sg.chunks);
  return P.islands[i].frame_chunk.filter(c => set.has(c)).length;
}

function segSplit() {
  if (selFrameIdx < 0) {
    toast("先に軌跡上の点をクリックして区切り位置を選んでください", false);
    return;
  }
  const isl = P.islands[cur], st = S[cur];
  const c = isl.frame_chunk[selFrameIdx];
  if (c < 0) { toast("この点のチャンクが特定できません", false); return; }
  // 分割対象の区間とチャンク位置を先に確定 (区切れない場合は状態を変えない)
  const k = st.segs ? chunkSegMap(cur)[c] : 0;
  const sg = st.segs ? st.segs[k] : {chunks: isl.chunks, ...cloneT(st)};
  const pos = sg.chunks.indexOf(c);
  if (pos <= 0) {
    toast("区間の先頭チャンクでは区切れません (もう少し後ろの点を選ぶ)", false);
    return;
  }
  if (!st.segs) st.segs = [sg];
  st.segs.splice(k, 1,
    {chunks: sg.chunks.slice(0, pos), ...cloneT(sg)},
    {chunks: sg.chunks.slice(pos), ...cloneT(sg)});
  st.active = k + 1;             // 選択点は後ろ側の区間に入る
  syncT();
  draw();
}

function segMerge() {
  const st = S[cur];
  if (!st.segs) { toast("区切りがありません", false); return; }
  const k = st.active;
  const lo = k > 0 ? k - 1 : 0;  // 前の区間と結合 (先頭なら次と)
  const a = st.segs[lo], b = st.segs[lo + 1];
  const keep = framesInSeg(cur, a) >= framesInSeg(cur, b) ? a : b;
  st.segs.splice(lo, 2, {chunks: a.chunks.concat(b.chunks), ...cloneT(keep)});
  st.active = lo;
  if (st.segs.length === 1) {    // 区間が1つに戻ったら通常状態へ
    st.A = st.segs[0].A; st.t = st.segs[0].t;
    st.segs = null; st.active = 0;
  }
  syncT();
  draw();
}

function setActiveSeg(k) {
  const st = S[cur];
  if (!st.segs || k >= st.segs.length) return;
  st.active = k;
  syncT();
  draw();
}

function renderSegs() {
  const el = document.getElementById("seginfo");
  const st = S[cur];
  if (!st || !st.segs) { el.innerHTML = "<span style='color:#889'>区間なし (島全体で1変換)</span>"; return; }
  el.innerHTML = st.segs.map((sg, k) => {
    const col = SEG_COLORS[k % SEG_COLORS.length];
    const nf = framesInSeg(cur, sg);
    const sel = k === st.active;
    return `<span onclick="setActiveSeg(${k})" style="cursor:pointer;
        display:inline-block; margin:2px; padding:1px 8px; border-radius:10px;
        border:1px solid ${sel ? col : '#444'}; color:${col};
        background:${sel ? '#2a2d36' : 'transparent'}">
        ${sel ? "▶" : ""}区間${k+1} <span style="color:#889">ch${sg.chunks[0]}–${sg.chunks[sg.chunks.length-1]} ${nf}f</span></span>`;
  }).join("");
}

// ---------------- 変換まわり (meshing.anchor_transform_cells / cells_to_px と同一規約)
function floorOf() { return P.floors[P.islands[cur].floor]; }

function applyTof(St, r, c) {
  return [St.A[0][0]*r + St.A[0][1]*c + St.t[0],
          St.A[1][0]*r + St.A[1][1]*c + St.t[1]];
}
function applyT(r, c) { return applyTof(T, r, c); }
function cellToPxOf(St, f, r, c) {
  const u = applyTof(St, r, c);
  return [f.x0_px + u[1] * f.cell_px, f.y0_px + u[0] * f.cell_px];
}
function cellToPx(r, c) { return cellToPxOf(T, floorOf(), r, c); }
function pxToGridCell(x, y) {
  const f = floorOf();
  return [(y - f.y0_px) / f.cell_px, (x - f.x0_px) / f.cell_px];
}
function transformOfFrame(i, j) {  // 島iのフレームj(表示順)に効く変換
  const st = S[i];
  if (!st.segs) return st;
  const k = segIdxOfFrame(i, j);
  return st.segs[k === undefined ? st.active : k];
}
function trajPx() {
  const f = floorOf();
  return P.islands[cur].cam_rc.map((rc, j) =>
    cellToPxOf(transformOfFrame(cur, j), f, rc[0], rc[1]));
}
function allSegMode() {
  const st = S[cur];
  return !!st.segs && document.getElementById("allseg").checked;
}
function targets() {               // 操作が効く変換群
  const st = S[cur];
  return allSegMode() ? st.segs : [T];
}
function centroidCell() {          // 操作対象フレーム群の重心 (グリッドセル座標)
  const st = S[cur], isl = P.islands[cur];
  const all = !st.segs || allSegMode();
  let r = 0, c = 0, n = 0;
  isl.cam_rc.forEach((p, j) => {
    if (!all && segIdxOfFrame(cur, j) !== st.active) return;
    const u = applyTof(transformOfFrame(cur, j), p[0], p[1]);
    r += u[0]; c += u[1]; n++;
  });
  return n ? [r / n, c / n] : [0, 0];
}

// 左から M を合成: A←M·A, t←cc + M·(t−cc)。対象=アクティブ区間 (一括なら全区間)
function leftMulSt(St, M, cc) {
  const A = St.A;
  St.A = [[M[0][0]*A[0][0] + M[0][1]*A[1][0], M[0][0]*A[0][1] + M[0][1]*A[1][1]],
          [M[1][0]*A[0][0] + M[1][1]*A[1][0], M[1][0]*A[0][1] + M[1][1]*A[1][1]]];
  const dr = St.t[0] - cc[0], dc = St.t[1] - cc[1];
  St.t = [cc[0] + M[0][0]*dr + M[0][1]*dc, cc[1] + M[1][0]*dr + M[1][1]*dc];
}
function leftMul(M, cc) { for (const St of targets()) leftMulSt(St, M, cc); }
// kx=図面x(col)方向, ky=図面y(row)方向 のスケール
function applyScale(kx, ky, cCell) { leftMul([[ky, 0], [0, kx]], cCell); }
function applyRot(dphi, cCell) {
  const co = Math.cos(dphi), si = Math.sin(dphi);
  leftMul([[co, -si], [si, co]], cCell);
}

function thetaOf() {               // 極分解の回転角
  return Math.atan2(T.A[1][0] - T.A[0][1], T.A[0][0] + T.A[1][1]);
}
function svals() {                 // 特異値 (σmax, σmin)
  const [[a,b],[c,d]] = T.A;
  const e = (a*a + b*b + c*c + d*d) / 2;
  const f = Math.sqrt(Math.max(e*e - Math.pow(a*d - b*c, 2), 0));
  return [Math.sqrt(e + f), Math.sqrt(Math.max(e - f, 0))];
}

function nudgeRot(sign, fine) {
  applyRot(sign * (fine ? 0.1 : 1.0) * Math.PI / 180, centroidCell());
  draw();
}
function nudgeScale(kx, ky) { applyScale(kx, ky, centroidCell()); draw(); }

// ---------------------------------------------------------------- 描画
function resize() {
  const m = document.getElementById("main");
  cv.width = m.clientWidth; cv.height = m.clientHeight;
  draw();
}
window.addEventListener("resize", resize);

function fitView() {
  const im = drawImgs[P.islands[cur].floor];
  const W = (im && im.naturalWidth) || P.drawing_wh[0];
  const H = (im && im.naturalHeight) || P.drawing_wh[1];
  const m = document.getElementById("main");
  view.s = Math.min(m.clientWidth / W, m.clientHeight / H) * 0.96;
  view.x = (m.clientWidth - W * view.s) / 2;
  view.y = (m.clientHeight - H * view.s) / 2;
}

function colorOf(i, n) { return `hsl(${20 + 320 * i / Math.max(n - 1, 1)}, 90%, 55%)`; }

// 密度チャンク画像 (白+アルファ) を色に着色した canvas (キャッシュ)
function tintedChunk(i, c, color) {
  const im = denChunkImgs[i] && denChunkImgs[i][c];
  if (!im || !im.complete || !im.naturalWidth) return null;
  const key = i + "_" + c + "_" + color;
  let cnv = tintCache[key];
  if (!cnv) {
    cnv = document.createElement("canvas");
    cnv.width = im.naturalWidth; cnv.height = im.naturalHeight;
    const c2 = cnv.getContext("2d");
    c2.fillStyle = color;
    c2.fillRect(0, 0, cnv.width, cnv.height);
    c2.globalCompositeOperation = "destination-in";
    c2.drawImage(im, 0, 0);
    tintCache[key] = cnv;
  }
  return cnv;
}

// density画像(ix=col, iy=row) → 図面px のアフィンを ctx に積む
//   x = x0 + cellpx*(A10*iy + A11*ix + t_c), y = y0 + cellpx*(A00*iy + A01*ix + t_r)
function denTransform(f, St) {
  const k = f.cell_px, A = St.A;
  ctx.transform(k * A[1][1], k * A[0][1], k * A[1][0], k * A[0][0],
                f.x0_px + k * St.t[1], f.y0_px + k * St.t[0]);
}

function draw() {
  if (!ctx || cur < 0 || !P) return;
  const isl = P.islands[cur], f = floorOf();
  const st = S[cur];
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.fillStyle = "#101014";
  ctx.fillRect(0, 0, cv.width, cv.height);
  ctx.setTransform(view.s, 0, 0, view.s, view.x, view.y);
  const dim = drawImgs[isl.floor];
  if (dim && dim.complete) ctx.drawImage(dim, 0, 0);

  // 密度オーバーレイ
  if (document.getElementById("showden").checked) {
    if (st.segs && denChunkImgs[cur]) {
      // 区間ごとに色分けし、各区間の変換で描く (アクティブ区間を最後・明るく)
      const order = st.segs.map((_, k) => k)
        .sort((a, b) => (a === st.active) - (b === st.active));
      for (const k of order) {
        const col = SEG_COLORS[k % SEG_COLORS.length];
        const sg = st.segs[k];
        ctx.save();
        denTransform(f, sg);
        ctx.globalAlpha = k === st.active ? 0.6 : 0.3;
        for (const c of sg.chunks) {
          const tc = tintedChunk(cur, c, col);
          if (tc) ctx.drawImage(tc, 0, 0);
        }
        ctx.restore();
      }
    } else {
      const den = denImgs[cur];
      if (den && den.complete) {
        ctx.save();
        denTransform(f, T);
        ctx.globalAlpha = 0.5;
        ctx.drawImage(den, 0, 0);
        ctx.restore();
      }
    }
  }

  // 同じ階の他の島: 薄いゴーストで表示 (それぞれの現在の変換 S[i] を使う)
  if (document.getElementById("showothers").checked) {
    P.islands.forEach((o, i) => {
      if (i === cur || o.floor !== isl.floor) return;
      const col = ISLAND_COLORS[i % ISLAND_COLORS.length];
      const gp = o.cam_rc.map((rc, j) =>
        cellToPxOf(transformOfFrame(i, j), f, rc[0], rc[1]));
      ctx.lineWidth = 1.0 / view.s;
      ctx.strokeStyle = col + "99";
      ctx.beginPath();
      gp.forEach((p, j) => j ? ctx.lineTo(p[0], p[1]) : ctx.moveTo(p[0], p[1]));
      ctx.stroke();
      const r0 = Math.max(1.8 / view.s, 0.9);
      ctx.fillStyle = col + "66";
      for (let j = 0; j < gp.length; j += 2) {
        ctx.beginPath(); ctx.arc(gp[j][0], gp[j][1], r0, 0, 7); ctx.fill();
      }
      // 始点にタグ名ラベル
      ctx.fillStyle = col;
      ctx.font = `${13 / view.s}px sans-serif`;
      ctx.fillText(o.tag.replace(/^cm\d+_/, ""), gp[0][0], gp[0][1] - 6 / view.s);
    });
  }

  const pts = trajPx();
  if (st.segs) {
    // 区間ごとに色分け。アクティブ区間は太く明るく
    for (let j = 1; j < pts.length; j++) {
      const k = segIdxOfFrame(cur, j) ?? st.active;
      const act = k === st.active;
      ctx.strokeStyle = SEG_COLORS[k % SEG_COLORS.length] + (act ? "ee" : "77");
      ctx.lineWidth = (act ? 2.4 : 1.2) / view.s;
      ctx.beginPath();
      ctx.moveTo(pts[j-1][0], pts[j-1][1]);
      ctx.lineTo(pts[j][0], pts[j][1]);
      ctx.stroke();
    }
    // 区切り位置 (各区間の先頭フレーム) にマーカー
    let prev = null;
    const mr = 6 / view.s;
    for (let j = 0; j < pts.length; j++) {
      const k = segIdxOfFrame(cur, j);
      if (k === undefined || k === prev) continue;
      prev = k;
      ctx.strokeStyle = "#fff";
      ctx.lineWidth = 1.5 / view.s;
      ctx.strokeRect(pts[j][0] - mr, pts[j][1] - mr, 2 * mr, 2 * mr);
      ctx.fillStyle = SEG_COLORS[k % SEG_COLORS.length];
      ctx.font = `${12 / view.s}px sans-serif`;
      ctx.fillText(`${k + 1}`, pts[j][0] + mr * 1.2, pts[j][1] - mr * 0.4);
    }
  } else {
    ctx.lineWidth = 1.2 / view.s;
    ctx.strokeStyle = "rgba(255,170,40,.8)";
    ctx.beginPath();
    pts.forEach((p, i) => i ? ctx.lineTo(p[0], p[1]) : ctx.moveTo(p[0], p[1]));
    ctx.stroke();
  }
  const rad = Math.max(3 / view.s, 1.5);
  pts.forEach((p, i) => {
    ctx.fillStyle = colorOf(i, pts.length);
    ctx.beginPath(); ctx.arc(p[0], p[1], rad, 0, 7); ctx.fill();
  });
  ctx.fillStyle = "#fff";
  const a = pts[0], b = pts[pts.length - 1], tr = 7 / view.s;
  ctx.beginPath(); ctx.moveTo(a[0], a[1] - tr); ctx.lineTo(a[0] - tr, a[1] + tr);
  ctx.lineTo(a[0] + tr, a[1] + tr); ctx.closePath(); ctx.fill();
  ctx.fillRect(b[0] - tr * .7, b[1] - tr * .7, tr * 1.4, tr * 1.4);
  if (selFrameIdx >= 0) {
    const sp = pts[selFrameIdx];
    ctx.strokeStyle = "#fff"; ctx.lineWidth = 2 / view.s;
    ctx.beginPath(); ctx.arc(sp[0], sp[1], rad * 2.2, 0, 7); ctx.stroke();
  }
  updateNums(pts);
}

function updateNums(pts) {
  let len = 0;
  for (let i = 1; i < pts.length; i++)
    len += Math.hypot(pts[i][0] - pts[i-1][0], pts[i][1] - pts[i-1][1]);
  const m = len * P.mm_per_px / 1000;
  const deg = (thetaOf() * 180 / Math.PI) % 360;
  const [s1, s2] = svals();
  const sEq = Math.sqrt(Math.abs(T.A[0][0]*T.A[1][1] - T.A[0][1]*T.A[1][0]));
  const st = S[cur];
  const segLine = st.segs
    ? (allSegMode() ? `[全${st.segs.length}区間を一括操作]\n`
                    : `[区間 ${st.active+1}/${st.segs.length} を操作中]\n`)
    : "";
  document.getElementById("nums").textContent = segLine +
    `s  = ${sEq.toFixed(4)} (σ ${s1.toFixed(3)}/${s2.toFixed(3)}, 比 ${(s1/Math.max(s2,1e-9)).toFixed(3)})\n` +
    `th = ${deg.toFixed(2)}°\nt  = [${T.t[0].toFixed(2)}, ${T.t[1].toFixed(2)}]\n` +
    `軌跡全長 ≈ ${m.toFixed(1)} m`;
  const slider = document.getElementById("rot");
  slider.value = ((deg + 540) % 360) - 180;
  document.getElementById("rotv").textContent = deg.toFixed(1);
}

// ---------------------------------------------------------------- 操作
let drag = null, spaceHeld = false;
function toDrawingPx(ev) {
  const r = cv.getBoundingClientRect();
  return [(ev.clientX - r.left - view.x) / view.s,
          (ev.clientY - r.top - view.y) / view.s];
}

cv && cv.addEventListener("mousedown", ev => {
  const pan = ev.button === 2 || spaceHeld;
  drag = {x: ev.clientX, y: ev.clientY, pan, moved: 0};
  cv.style.cursor = "grabbing";
});
window.addEventListener("mousemove", ev => {
  if (!drag) return;
  const dx = ev.clientX - drag.x, dy = ev.clientY - drag.y;
  drag.x = ev.clientX; drag.y = ev.clientY;
  drag.moved += Math.abs(dx) + Math.abs(dy);
  if (drag.pan) { view.x += dx; view.y += dy; }
  else {
    const f = floorOf();
    const dr = dy / view.s / f.cell_px, dc = dx / view.s / f.cell_px;
    for (const St of targets()) { St.t[0] += dr; St.t[1] += dc; }
  }
  draw();
});
window.addEventListener("mouseup", ev => {
  if (drag && !drag.pan && drag.moved < 4) pickPoint(ev);
  drag = null;
  if (cv) cv.style.cursor = "grab";
});
cv && cv.addEventListener("contextmenu", ev => ev.preventDefault());

cv && cv.addEventListener("wheel", ev => {
  ev.preventDefault();
  const k = Math.exp(-ev.deltaY * 0.0012);
  if (ev.altKey) {                         // Alt: 片軸スケール (マウス位置中心)
    const [x, y] = toDrawingPx(ev);
    const c = pxToGridCell(x, y);
    if (ev.shiftKey) applyScale(1, k, c);  // Alt+Shift = Y(縦)のみ
    else applyScale(k, 1, c);              // Alt = X(横)のみ
  } else if (ev.shiftKey) {                // Shift = 等方スケール
    const [x, y] = toDrawingPx(ev);
    applyScale(k, k, pxToGridCell(x, y));
  } else {                                 // ビューズーム
    const r = cv.getBoundingClientRect();
    const mx = ev.clientX - r.left, my = ev.clientY - r.top;
    view.x = mx + (view.x - mx) * k;
    view.y = my + (view.y - my) * k;
    view.s *= k;
  }
  draw();
}, {passive: false});

window.addEventListener("keydown", ev => {
  if (ev.target.tagName === "INPUT" && ev.target.type !== "range") return;
  if (lb.open && ev.key !== "ArrowLeft" && ev.key !== "ArrowRight") return;
  if (ev.code === "Space") { spaceHeld = true; ev.preventDefault(); }
  if (ev.key === "q" || ev.key === "Q") nudgeRot(-1, ev.shiftKey);
  if (ev.key === "e" || ev.key === "E") nudgeRot(1, ev.shiftKey);
  if (ev.key === "ArrowLeft" && selFrameIdx > 0) showFrame(selFrameIdx - 1);
  if (ev.key === "ArrowRight" && selFrameIdx >= 0 &&
      selFrameIdx < P.islands[cur].frames.length - 1) showFrame(selFrameIdx + 1);
});
window.addEventListener("keyup", ev => { if (ev.code === "Space") spaceHeld = false; });

document.getElementById("rot") && document.getElementById("rot")
  .addEventListener("input", ev => {
    const target = parseFloat(ev.target.value) * Math.PI / 180;
    applyRot(target - thetaOf(), centroidCell());
    draw();
  });

function pickPoint(ev) {
  const [x, y] = toDrawingPx(ev);
  const pts = trajPx();
  let best = -1, bd = 10 / view.s;
  pts.forEach((p, i) => {
    const d = Math.hypot(p[0] - x, p[1] - y);
    if (d < bd) { bd = d; best = i; }
  });
  if (best >= 0) showFrame(best);
}

function showFrame(idx) {
  selFrameIdx = idx;
  const st = S[cur];
  if (st.segs) {                 // 点クリックでその区間をアクティブに
    const k = segIdxOfFrame(cur, idx);
    if (k !== undefined && k !== st.active) { st.active = k; syncT(); }
  }
  const num = P.islands[cur].frames[idx];
  document.getElementById("framebox").innerHTML =
    `<h3>frame ${num} <span style="color:#889">(${idx+1}/${P.islands[cur].frames.length})</span></h3>
     <img src="/frame?sess=${P.sess}&num=${num}" alt="frame ${num}"
          title="クリックで拡大" onclick="openLightbox()">`;
  if (lb.open) lbLoad();
  draw();
}

// ---------------------------------------------------------------- 拡大表示
const lb = {open: false, s: 1, x: 0, y: 0, drag: null};
const lbEl = document.getElementById("lightbox");
const lbImg = document.getElementById("lbimg");

function lbLoad() {
  const num = P.islands[cur].frames[selFrameIdx];
  document.getElementById("lbtitle").textContent =
    `frame ${num} (${selFrameIdx+1}/${P.islands[cur].frames.length})`;
  lbImg.src = `/frame?sess=${P.sess}&num=${num}&w=2688`;   // 高解像度版
}

function openLightbox() {
  if (selFrameIdx < 0) return;
  lb.open = true;
  lbEl.style.display = "block";
  lbImg.onload = () => {
    // 初期表示: 横幅フィット・中央
    lb.s = window.innerWidth / lbImg.naturalWidth;
    lb.x = 0;
    lb.y = (window.innerHeight - lbImg.naturalHeight * lb.s) / 2;
    lbApply();
  };
  lbLoad();
}
function closeLightbox() { lb.open = false; lbEl.style.display = "none"; }
function lbApply() {
  lbImg.style.transform = `translate(${lb.x}px, ${lb.y}px) scale(${lb.s})`;
}
function lbNav(d) {
  const n = P.islands[cur].frames.length;
  const i = selFrameIdx + d;
  if (i >= 0 && i < n) showFrame(i);
}

lbEl.addEventListener("wheel", ev => {
  ev.preventDefault();
  const k = Math.exp(-ev.deltaY * 0.0015);
  lb.x = ev.clientX + (lb.x - ev.clientX) * k;
  lb.y = ev.clientY + (lb.y - ev.clientY) * k;
  lb.s *= k;
  lbApply();
}, {passive: false});
lbEl.addEventListener("mousedown", ev => {
  if (ev.target.tagName === "BUTTON") return;
  lb.drag = {x: ev.clientX, y: ev.clientY};
  lbEl.style.cursor = "grabbing";
  ev.preventDefault();
});
window.addEventListener("mousemove", ev => {
  if (!lb.drag) return;
  lb.x += ev.clientX - lb.drag.x;
  lb.y += ev.clientY - lb.drag.y;
  lb.drag = {x: ev.clientX, y: ev.clientY};
  lbApply();
});
window.addEventListener("mouseup", () => {
  lb.drag = null;
  if (lb.open) lbEl.style.cursor = "grab";
});
window.addEventListener("keydown", ev => {
  if (!lb.open) return;
  if (ev.key === "Escape") closeLightbox();
});

// ---------------------------------------------------------------- 保存
function toast(msg, ok) {
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.style.background = ok ? "#1d4d2b" : "#5f2b2b";
  t.style.color = ok ? "#b7f3c8" : "#f3b7b7";
  t.style.display = "block";
  setTimeout(() => t.style.display = "none", 2500);
}

async function save() {
  const st = S[cur];
  const body = {sess: P.sess, tag: P.islands[cur].tag, A: T.A, t: T.t};
  if (st.segs) {
    body.segments = st.segs.map(sg => ({chunks: sg.chunks, A: sg.A, t: sg.t}));
  }
  try {
    const r = await fetch("/save", {
      method: "POST", headers: {"Content-Type": "application/json"},
      body: JSON.stringify(body)});
    if (!r.ok) throw new Error(await r.text());
    const res = await r.json();
    P.islands[cur].saved = true;
    P.islands[cur].init = cloneT(T);
    P.islands[cur].segments = st.segs ? st.segs.map(cloneSeg) : null;
    renderIslands();
    toast(`${P.islands[cur].tag} を登録しました` +
          (res.n_segments ? ` (${res.n_segments}区間)` : ""), true);
  } catch (e) {
    toast("保存失敗: " + e.message, false);
  }
}
</script>
