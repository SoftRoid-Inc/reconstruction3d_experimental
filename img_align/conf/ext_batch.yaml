# 外部テストデータセット実走の設定 (hydra)
#
# 上書きはコマンドラインで:
#   python -m img_align.tools.ext_batch run select.limit=10 run.keep_chunks=true
# 設定ファイルを足して切り替えることもできる:
#   python -m img_align.tools.ext_batch run --config-name ext_batch_long

paths:
  # GT と s3キー一覧の置き場 (polish-pipeline)
  src: /home/maren/git/polish-pipeline/scripts/sfm_testdataset
  # 画像・マスクのバケット
  bucket: s3://p2-test-data-bucket/person_mask_gt
  # 間取り図のバケット
  drawing_bucket: s3://zenshot-private-bucket-production/
  # 取り込み先。ext/ は /home/maren/temp へのsymlink (/mnt/data が逼迫)
  ext: ext

select:
  # 短すぎ=島が立たない / 長すぎ=1件が重い
  min_frames: 150
  max_frames: 900
  camera: INSTA        # PanoVGGTは等距円筒が要る
  limit: 5
  skip: 0
  # フロア数が多く・短いものを優先 (情報量が多くて軽い)
  order: floors_desc

pipeline:
  segments: gt         # 外部データはIMUが無いのでGTの階ラベルで切る
  max_seg: 160
  stride: null         # null=既定(12)
  chunk_size: null     # null=既定(16)
  posegraph: true      # 島ごとにポーズグラフ+ループ拘束も走らせる

run:
  # **ディスクが律速**: 1件13GB。評価が済んだら素材を消す
  keep_chunks: false
  # 次の件のS3取込を現在の件の推論に重ねる (取込82秒が隠れる)
  prefetch: true
  verbose: true

report:
  out: img_align/results/ext_batch_report.html
  data: img_align/results/ext_batch_data.json

hydra:
  run:
    dir: .
  output_subdir: null
  job:
    chdir: false
